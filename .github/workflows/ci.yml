name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # A fresh SQLite database per test; never a real one (tests/conftest.py).
      - run: python -m pytest

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the frontend for browser tests
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8010
          NEXT_DIST_DIR: .next-e2e
      - name: Check the test backend starts
        run: |
          python ../backend/tests/e2e_server.py --port 8010 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8010/ && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8010/
          kill %1
      # Starts a seeded throwaway backend and serves the build above (playwright.config.ts).
      - name: Run browser tests
        run: npx playwright test
        env:
          NEXT_DIST_DIR: .next-e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
